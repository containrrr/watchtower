---
name: Run Tests and Upload Coverage

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - cmd/**
      - internal/**
      - pkg/**
      - tools/tplprev/**
      - go.mod
      - go.sum
      - main.go

permissions:
  contents: read # Set default read-only permissions

jobs:
  test:
    name: Run Tests and Upload Coverage Report
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - windows-2025
          - ubuntu-latest
    steps:
      - name: Harden the Runner (Step Security)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: true
          cache-dependency-path: "**/go.sum"
          go-version-file: go.mod

      - name: Install Dependencies
        run: go mod download

      - name: Run Tests
        run: |
          go test -timeout 60s -coverprofile="coverage.out" -covermode atomic ./...

      - name: Run tplprev Tests
        run: go -C tools/tplprev test -timeout 60s -v ./...

      - name: Upload Coverage Report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  race:
    name: Run Tests with the Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Harden the Runner (Step Security)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: true
          cache-dependency-path: "**/go.sum"
          go-version-file: go.mod

      - name: Run Tests with the Race Detector
        run: go test -race -timeout 120s ./...
