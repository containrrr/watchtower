# git-cliff Configuration File
# https://git-cliff.org/docs/configuration

[remote.github]
owner = "nicholas-fedor"
repo = "watchtower"

[changelog]
# ──────────────────────────────────────────────────────────────
# A Tera template to be rendered as the changelog's header.
# See https://keats.github.io/tera/docs/#introduction
# ──────────────────────────────────────────────────────────────
header = """
<!-- markdownlint-disable MD024 -->
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# ──────────────────────────────────────────────────────────────
# A Tera template to be rendered for each release in the changelog.
# Groups carry a numbered HTML comment so they sort in a fixed order.
# The comment is stripped before the heading is printed.
# See https://keats.github.io/tera/docs/#introduction
# ──────────────────────────────────────────────────────────────
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% if version %}
    ## [{{ version | trim_start_matches(pat="v") }}] - {% if commits | length > 0 %}{{ commits[0].committer.timestamp | date(format="%Y-%m-%d") }}{% else %}{{ timestamp | date(format="%Y-%m-%d") }}{% endif %}
{% else %}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}**Breaking:** {% endif -%}
            {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
            {% if commit.remote.username %} by @{{ commit.remote.username }}{%- endif -%}
            {% if commit.remote.pr_number %} in \
            [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}) \
            {%- endif -%}
    {% endfor %}
{% endfor -%}

{%- if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
    ### New Contributors
{% endif -%}

{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
  - @{{ contributor.username }} made their first contribution\
    {%- if contributor.pr_number %} in [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}){%- endif -%}
{% endfor %}

{%- if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}{{"\n"}}{% endif %}
"""

# ──────────────────────────────────────────────────────────────
# A Tera template to be rendered as the changelog's footer.
# The comparison list appears once there are two refs to compare.
# See https://keats.github.io/tera/docs/#introduction
# ──────────────────────────────────────────────────────────────
footer = """
{% macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% set versioned = releases | filter(attribute="version") -%}
{% if versioned | length > 1 or (versioned | length == 1 and releases | length > 1) %}
## Compare Releases

{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous and release.previous.version -%}
            - [{{ release.version | trim_start_matches(pat="v") }}]({{ self::remote_url() }}/compare/{{ release.previous.version }}...{{ release.version }})
        {% endif -%}
    {% else -%}
        {% if release.previous and release.previous.version -%}
            - [unreleased]({{ self::remote_url() }}/compare/{{ release.previous.version }}...HEAD)
        {% endif -%}
    {% endif -%}
{% endfor -%}
{% endif %}
<!-- generated by git-cliff -->
"""

# Remove leading and trailing whitespaces from the changelog's body.
trim = true

[git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Keep commits that do not follow the specification. The last parser files them under Changed.
filter_unconventional = false
# Drop the "(#123)" suffix GitHub adds to squash merges. The PR link comes from the remote.
commit_preprocessors = [{ pattern = '\s*\((\w+\s)?#([0-9]+)\)', replace = "" }]
# Groups follow the Conventional Commits type. The first matching parser wins.
# Commits from before the project adopted Conventional Commits are grouped by
# their leading verb instead, and anything left over is filed under Changed.
commit_parsers = [
  # Skip the automated changelog pull requests and merge commits. The changes a
  # merge brings in are listed through their own commits.
  { message = "^docs\\(changelog\\): update changelog(\\n|$)", skip = true },
  { message = "^Merge (pull request|branch|remote-tracking branch) ", skip = true },
  { field = "author.name", pattern = "(renovate|dependabot)\\[bot\\]", group = "<!-- 9 -->Chores" },
  { field = "author.name", pattern = "allcontributors\\[bot\\]", group = "<!-- 4 -->Documentation" },
  { message = "(?i)^(chore|fix|build)(\\(deps\\))?!?:.*(update (module|dependency)|bump.*from.*to)", group = "<!-- 9 -->Chores" },
  { message = "^feat(\\(|!|:)", group = "<!-- 0 -->Added" },
  { message = "^fix(\\(|!|:)", group = "<!-- 1 -->Fixed" },
  { message = "^perf(\\(|!|:)", group = "<!-- 2 -->Performance" },
  { message = "^(refactor|style)(\\(|!|:)", group = "<!-- 3 -->Changed" },
  { message = "^docs?(\\(|!|:)", group = "<!-- 4 -->Documentation" },
  { message = "^test(\\(|!|:)", group = "<!-- 5 -->Tests" },
  { message = "^build(\\(|!|:)", group = "<!-- 6 -->Build" },
  { message = "^ci(\\(|!|:)", group = "<!-- 7 -->Continuous Integration" },
  { message = "^revert(\\(|!|:)", group = "<!-- 8 -->Reverted" },
  { message = "^chore(\\(|!|:)", group = "<!-- 9 -->Chores" },
  # Commits that predate Conventional Commits, matched by their whole leading verb.
  { message = "(?i)^bump .* from .* to ", group = "<!-- 9 -->Chores" },
  { message = "(?i)^(add(s|ed|ing)?|support(s|ed|ing)?)\\b", group = "<!-- 0 -->Added" },
  { message = "(?i)^fix(es|ed|ing)?\\b", group = "<!-- 1 -->Fixed" },
  { message = "(?i)^(remov(e|es|ed|ing)|delet(e|es|ed|ing))\\b", group = "<!-- 3 -->Removed" },
  { message = "^.*", group = "<!-- 3 -->Changed" },
]
# Exclude commits that are not matched by any commit parser.
filter_commits = true
# Order releases topologically instead of chronologically.
topo_order = false
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "newest"
