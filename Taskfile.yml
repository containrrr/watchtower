# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  BINARY_NAME: watchtower
  GOLANGCI_CONFIG: "{{.ROOT_DIR}}/build/golangci-lint/golangci-lint.yaml"
  MOCKERY_CONFIG: build/mockery/mockery.yaml
  MKDOCS_CONFIG: build/mkdocs/mkdocs.yaml
  DOCS_VENV: watchtower-docs
  TPLPREV_DIR: tools/tplprev
  # Packages that cannot run under -count yet: Ginkgo suites reject -count>1.
  # Packages leave this list as their suites are converted.
  REPEAT_EXCLUDE: >-
    /internal/actions$|/internal/logging$|/pkg/container$|/pkg/notifications$|/pkg/sorter$

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # Development

  build:
    desc: Build the watchtower binary into bin/
    cmds:
      - go build -o bin/{{.BINARY_NAME}} .

  run:
    desc: "Run watchtower (pass flags after --, e.g. task run -- --help)"
    cmds:
      - go run . {{.CLI_ARGS}}

  install:
    desc: Install the watchtower binary
    cmds:
      - go install .

  test:
    desc: Run all tests with coverage
    cmds:
      - go test -timeout 30s -coverprofile coverage.out -covermode atomic ./...

  test:race:
    desc: Run all tests with the race detector
    cmds:
      - go test -race -timeout 120s ./...

  test:repeat:
    desc: Run repeat-safe packages twice in shuffled order to catch leaked state
    cmds:
      - go test -count=2 -shuffle=on -timeout 120s $(go list ./... | grep -Ev '{{.REPEAT_EXCLUDE}}')

  fuzz:
    desc: "Run each fuzz target for 10s (FUZZTIME), in FUZZPKGS (default ./...), with FUZZPARALLEL workers (default 8)"
    cmds:
      - |
        set -eu
        pkgs=$(go list {{.FUZZPKGS | default "./..."}})
        for pkg in $pkgs; do
          case "$pkg" in */mocks) continue ;; esac
          listing=$(go test -list '^Fuzz' "$pkg")
          targets=$(printf '%s\n' "$listing" | grep '^Fuzz' || true)
          for target in $targets; do
            echo "fuzzing $pkg $target"
            go test -run='^$' -fuzz="^${target}\$" -fuzztime={{.FUZZTIME | default "10s"}} -parallel={{.FUZZPARALLEL | default "8"}} "$pkg"
          done
        done

  test:update-golden:
    desc: Rewrite golden test files from the current output (review the diff before committing)
    env:
      UPDATE_GOLDEN: "1"
    cmds:
      - go test -count=1 ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint and apply automatic fixes
    cmds:
      - golangci-lint run --fix --config {{.GOLANGCI_CONFIG}} ./...

  lint:check:
    desc: Run golangci-lint without modifying files
    cmds:
      - golangci-lint run --fix=false --config {{.GOLANGCI_CONFIG}} ./...

  fmt:
    desc: Format the codebase
    cmds:
      - golangci-lint fmt --config {{.GOLANGCI_CONFIG}} ./...

  swag:fmt:
    desc: Format Swagger annotation comments with the swag CLI
    cmds:
      - go tool swag fmt -d ./ -g main.go

  swag:gen:
    desc: Regenerate the Swagger documents in internal/api/swagger
    cmds:
      - go tool swag init --quiet -d ./ -g main.go -o internal/api/swagger

  swag:check:
    desc: Fail if the committed Swagger documents differ from freshly generated ones
    vars:
      # The documents are generated outside the module so the copy never becomes
      # a package that go vet, go test, or golangci-lint pick up.
      TEMP_DIR:
        sh: mktemp -d
      # swag names the generated package after its output directory.
      CHECK_DIR: "{{.TEMP_DIR}}/swagger"
    cmds:
      - defer: rm -rf "{{.TEMP_DIR}}"
      - go tool swag init --quiet -d ./ -g main.go -o "{{.CHECK_DIR}}"
      - diff -u internal/api/swagger/docs.go "{{.CHECK_DIR}}/docs.go"
      - diff -u internal/api/swagger/swagger.json "{{.CHECK_DIR}}/swagger.json"
      - diff -u internal/api/swagger/swagger.yaml "{{.CHECK_DIR}}/swagger.yaml"

  mocks:
    desc: Regenerate mocks with the mockery version pinned in go.mod, removing mocks of deleted interfaces
    cmds:
      # mockery never deletes a mock whose interface is gone, so the generated
      # mocks are removed first. Hand-written fakes lack the generated header.
      - find pkg internal -path '*/mocks/*.go' -type f -exec grep -l '^// Code generated by mockery' {} + | xargs rm -f
      - go tool mockery --config {{.MOCKERY_CONFIG}}

  mocks:check:
    desc: Regenerate mocks and fail if they differ from the committed ones (review the changes it leaves)
    cmds:
      - task: mocks
      - |
        changes="$(git status --porcelain --untracked-files=all -- ':(glob)**/mocks/**')"
        if [ -n "${changes}" ]; then
          echo "Generated mocks differ from the committed ones. Review and commit these changes:" >&2
          echo "${changes}" >&2
          exit 1
        fi

  # Template preview module

  tplprev:gen:
    desc: Regenerate the template preview module's copies of the notification templates and report contract
    env:
      UPDATE_GOLDEN: "1"
    cmds:
      - go test -count=1 -run 'TestTplprev(TemplatesInSync|ReportContractInSync)$' ./pkg/notifications/

  tplprev:test:
    desc: Run tplprev module tests
    cmds:
      - go -C {{.TPLPREV_DIR}} test -timeout 30s -v ./...

  tplprev:lint:
    desc: Lint the tplprev module
    dir: "{{.TPLPREV_DIR}}"
    cmds:
      - golangci-lint run --config {{.GOLANGCI_CONFIG}} ./...

  tplprev:vet:
    desc: Run go vet on the tplprev module
    cmds:
      - go -C {{.TPLPREV_DIR}} vet ./...

  tplprev:fmt:
    desc: Format the tplprev module
    dir: "{{.TPLPREV_DIR}}"
    cmds:
      - golangci-lint fmt --config {{.GOLANGCI_CONFIG}} ./...

  # Dependencies

  mod:tidy:
    desc: Tidy Go module dependencies
    cmds:
      - go mod tidy

  mod:download:
    desc: Download Go module dependencies
    cmds:
      - go mod download

  # Documentation

  docs:
    desc: Set up, build the template preview assets, and serve the documentation site locally
    cmds:
      - task: docs:setup
      - task: docs:gen
      - task: docs:serve

  docs:setup:
    desc: Create the MkDocs virtual environment and install dependencies
    cmds:
      - python3 -m venv {{.DOCS_VENV}}
      - "{{.DOCS_VENV}}/bin/pip install -r build/mkdocs/docs-requirements.txt"

  docs:gen:
    desc: Build the template preview WASM assets for the docs
    cmds:
      - bash ./scripts/build-tplprev.sh

  docs:build:
    desc: Build the MkDocs site
    cmds:
      - "{{.DOCS_VENV}}/bin/mkdocs build --config-file {{.MKDOCS_CONFIG}}"

  docs:serve:
    desc: Serve the MkDocs site locally with live reload
    cmds:
      - "{{.DOCS_VENV}}/bin/mkdocs serve --config-file {{.MKDOCS_CONFIG}} --livereload"

  # Release and Docker

  release:
    desc: "Create a release with GoReleaser (CONFIG=stable|nightly, default stable)"
    vars:
      CONFIG: '{{.CONFIG | default "stable"}}'
    cmds:
      - goreleaser release --config build/goreleaser/{{.CONFIG}}.yaml --clean

  release:snapshot:
    desc: "Build a local snapshot with GoReleaser without publishing (CONFIG=stable|nightly)"
    vars:
      CONFIG: '{{.CONFIG | default "stable"}}'
    cmds:
      - goreleaser release --config build/goreleaser/{{.CONFIG}}.yaml --snapshot --clean

  docker:build:
    desc: Build a local Docker image from the working tree
    cmds:
      - docker build -f build/docker/Dockerfile.self-local -t {{.BINARY_NAME}} .

  docker:run:
    desc: Run the local Docker image
    cmds:
      - docker run -p 8080:8080 -v /var/run/docker.sock:/var/run/docker.sock {{.BINARY_NAME}}

  # Housekeeping

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/
